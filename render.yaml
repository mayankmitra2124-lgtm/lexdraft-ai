# Render Blueprint for LexDraft AI (Phase 2 Clustered Architecture)
services:
  # 1. Web Tier (Puma / Rack Only)
  - type: web
    name: lexdraft-ai-web
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8080
      - key: RACK_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: 2
      - key: RAILS_MAX_THREADS
        value: 8
      - key: RAILS_MIN_THREADS
        value: 4
      - key: DB_POOL_SIZE
        value: 10
      - key: STANDALONE_WORKER
        value: "true"
      - key: DISABLE_EMBEDDED_WORKER
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_ADAPTER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lexdraft-postgres
          property: connectionString

  # 2. Worker Tier (Dedicated Background Job Daemon)
  - type: worker
    name: lexdraft-ai-worker
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    startCommand: bundle exec ruby bin/worker.rb
    envVars:
      - key: RACK_ENV
        value: production
      - key: STANDALONE_WORKER
        value: "true"
      - key: DB_POOL_SIZE
        value: 4
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_ADAPTER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lexdraft-postgres
          property: connectionString

databases:
  - name: lexdraft-postgres
    plan: starter
    region: oregon
    databaseName: lexdraft_prod
    user: lexdraft_user
